<svg xmlns="http://www.w3.org/2000/svg" width="880" height="548" viewBox="0 0 880 548" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial" role="img" aria-label="Everyday word error rate is nearly identical across five systems; on numbers, a naive scorer makes two of them look twice as bad">
<rect width="100%" height="100%" fill="#0d1117"/>
<text x="32" y="44" fill="#e6edf3" font-size="22" font-weight="700">Accuracy on the same 28 clips</text>
<text x="32" y="68" fill="#8b949e" font-size="13.5">Apple M2 MacBook Air · lower is better</text>
<rect x="300" y="92" width="13" height="13" rx="3" fill="#2f81f7"/><text x="320" y="103" fill="#c9d1d9" font-size="12.5">everyday dictation (prose, jargon, long, background speech)</text>
<rect x="300" y="112" width="13" height="13" rx="3" fill="#d29922"/><text x="320" y="123" fill="#c9d1d9" font-size="12.5">numbers group</text>
<text x="848" y="123" fill="#6e7681" font-size="11" text-anchor="end">0%  →  40%</text>
<text x="32" y="162" fill="#e6edf3" font-size="14" font-weight="600">NeMo-Speech · Parakeet TDT v3</text>
<text x="32" y="180" fill="#6e7681" font-size="11.5">9 errors of 414 reference words</text>
<rect x="300" y="150" width="28.2" height="17" rx="3" fill="#2f81f7"/>
<text x="336.2" y="163" fill="#79c0ff" font-size="12" font-weight="600">2.2%</text>
<rect x="300" y="172" width="223.5" height="17" rx="3" fill="#d29922"/>
<text x="531.5" y="185" fill="#e3b341" font-size="12" font-weight="600">17.2%</text>
<text x="32" y="236" fill="#e6edf3" font-size="14" font-weight="600">Hex · Parakeet v3</text>
<text x="32" y="254" fill="#6e7681" font-size="11.5">9 errors of 414 reference words</text>
<rect x="300" y="224" width="28.2" height="17" rx="3" fill="#2f81f7"/>
<text x="336.2" y="237" fill="#79c0ff" font-size="12" font-weight="600">2.2%</text>
<rect x="300" y="246" width="223.5" height="17" rx="3" fill="#d29922"/>
<text x="531.5" y="259" fill="#e3b341" font-size="12" font-weight="600">17.2%</text>
<text x="32" y="310" fill="#e6edf3" font-size="14" font-weight="600">Handy · Whisper small.en</text>
<text x="32" y="328" fill="#6e7681" font-size="11.5">9 errors of 414 reference words</text>
<rect x="300" y="298" width="28.2" height="17" rx="3" fill="#2f81f7"/>
<text x="336.2" y="311" fill="#79c0ff" font-size="12" font-weight="600">2.2%</text>
<rect x="300" y="320" width="467.2" height="17" rx="3" fill="#d29922"/>
<text x="775.2" y="333" fill="#e3b341" font-size="12" font-weight="600">35.9%</text>
<text x="32" y="384" fill="#e6edf3" font-size="14" font-weight="600">Handy · Parakeet Unified EN</text>
<text x="32" y="402" fill="#6e7681" font-size="11.5">11 errors of 414 reference words</text>
<rect x="300" y="372" width="34.6" height="17" rx="3" fill="#2f81f7"/>
<text x="342.6" y="385" fill="#79c0ff" font-size="12" font-weight="600">2.7%</text>
<rect x="300" y="394" width="467.2" height="17" rx="3" fill="#d29922"/>
<text x="775.2" y="407" fill="#e3b341" font-size="12" font-weight="600">35.9%</text>
<text x="32" y="458" fill="#e6edf3" font-size="14" font-weight="600">Handy · Parakeet TDT v3</text>
<text x="32" y="476" fill="#6e7681" font-size="11.5">11 errors of 414 reference words</text>
<rect x="300" y="446" width="34.6" height="17" rx="3" fill="#2f81f7"/>
<text x="342.6" y="459" fill="#79c0ff" font-size="12" font-weight="600">2.7%</text>
<rect x="300" y="468" width="406.2" height="17" rx="3" fill="#d29922"/>
<text x="714.2" y="481" fill="#e3b341" font-size="12" font-weight="600">31.2%</text>
<text x="32" y="534" fill="#8b949e" font-size="12.5">Everyday accuracy is a <tspan fill="#f0883e" font-weight="600">tie</tspan> — 9 vs 11 errors. The real differences are numbers and speed.</text>
<text x="32" y="556" fill="#6e7681" font-size="11.5">A naive scorer would call NeMo and Hex "twice as accurate" on numbers; the number-aware scorer shows the true miss rate.</text>
</svg>