<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial" role="img" aria-label="Time from releasing the key to text: resident servers about 150 ms; Handy 0.8 to 2 seconds on the first phrase">
